<div class="create-cow-page">
  <app-page-header title="Create Cow" [showBack]="true" fallbackUrl="/cows"></app-page-header>

  <form [formGroup]="form" #formDirective="ngForm" (ngSubmit)="submit()">

    <app-form-field label="Ear Tag" controlName="id">
      <app-text-input
        formControlName="id"
        placeholder="Enter ear tag">
      </app-text-input>
    </app-form-field>

    <app-form-field label="Gender" controlName="sex">
      <app-dropdown
        formControlName="sex"
        [options]="genderOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select gender">
      </app-dropdown>
    </app-form-field>

    <app-form-field label="Pen" controlName="pen">
      <app-dropdown
        formControlName="pen"
        [options]="penOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select pen">
      </app-dropdown>
    </app-form-field>

    <app-form-field label="Status" controlName="status">
      <app-dropdown
        formControlName="status"
        [options]="createCowStatusOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select status">
      </app-dropdown>
    </app-form-field>

    <app-form-field label="Weight (Optional)" controlName="weight">
      <app-number-input
        formControlName="weight"
        placeholder="Enter weight in kg"
        [min]="WEIGHT_MIN"
        [max]="WEIGHT_MAX"
        [allowDecimal]="true"
        [maxDecimalPlaces]="1">
      </app-number-input>
    </app-form-field>

  <div class="actions">
    <div class="actions-left">
      <app-button
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        (clicked)="cancel()">
      </app-button>
    </div>

    <div class="actions-right">
      <app-button
        label="Save & Add Another"
        severity="secondary"
        type="submit"
        [disabled]="form.invalid || submitting"
        (clicked)="submitAction = 'SAVE_AND_ADD'">
      </app-button>

      <app-button
        label="Save"
        severity="primary"
        type="submit"
        [disabled]="form.invalid || submitting"
        (clicked)="submitAction = 'SAVE'">
      </app-button>
    </div>
  </div>


  </form>
</div>
