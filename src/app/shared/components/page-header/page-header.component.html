<div class="page-header">
  <div class="page-header__left">
    <app-icon
      *ngIf="showBack"
      name="arrow-left"
      size="md"
      [clickable]="true"
      (iconClick)="goBack()">
    </app-icon>
    
    <h1 class="page-title">{{ title }}</h1>
  </div>

  <div class="page-header__right">
    <ng-content></ng-content>
  </div>
</div>
