<span class="p-input-icon-left w-full">
  <i class="pi pi-search"></i>
  <input
    pInputText
    class="w-full"
    type="text"
    [placeholder]="placeholder"
    [value]="value ?? ''"
    [pTooltip]="value || ''"
    tooltipPosition="bottom"
    [tooltipDisabled]="!value"
    (input)="onInput($event)" />
</span>
